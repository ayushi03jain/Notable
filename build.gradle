// Top-level build file where you can add configuration options common to all sub-projects/modules.
buildscript {
    repositories {
        // For older Gradle versions, add explicit Google maven URL as a fallback
        maven { url 'https://maven.google.com' }
        maven { url 'https://plugins.gradle.org/m2/' }
        maven { url 'https://repo.gradle.org/gradle/repo' }
        maven { url 'https://oss.sonatype.org/content/repositories/releases/' }
        mavenCentral()
        jcenter()
    }
    dependencies {
    // Updated Android Gradle Plugin to 3.0.1 to support newer repo layout
    classpath 'com.android.tools.build:gradle:3.0.1'
        classpath 'com.neenbedankt.gradle.plugins:android-apt:1.8'
    }
}

allprojects {
    repositories {
    // Ensure Google Maven is available for Android plugin artifacts
    maven { url 'https://maven.google.com' }
    maven { url 'https://plugins.gradle.org/m2/' }
    maven { url 'https://repo.gradle.org/gradle/repo' }
    maven { url 'https://oss.sonatype.org/content/repositories/releases/' }
    mavenCentral()
    jcenter()
        maven {
            url "https://jitpack.io"
        }
    }
}
